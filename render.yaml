services:
  - type: web
    name: parksetu
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py; uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard — keep secret
      - key: JWT_SECRET
        sync: false
      - key: EDGE_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGIN
        value: "https://park-setu.vercel.app"
